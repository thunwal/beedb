services:
  db:
    image: postgis/postgis:18-3.6-alpine
    env_file: .env
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
      - TZ=Europe/Zurich
      - PGTZ=Europe/Zurich
    volumes:
      - pgdata:/var/lib/postgresql
      - ./init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"  # loopback only — reachable via SSH tunnel, not from internet
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.5'

volumes:
  pgdata:
